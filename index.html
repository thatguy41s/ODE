<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ODE Hub 3.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg: #020617;
  --panel: #020617;
  --panel2: #0f172a;
  --accent: #38bdf8;
  --text: #e5e7eb;
  --danger: #ef4444;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* TOP BAR */
#top {
  display: flex;
  gap: 8px;
  padding: 8px;
  background: #020617;
  align-items: center;
  border-bottom: 1px solid #1e293b;
}

input, button, select {
  background: #020617;
  border: 1px solid #334155;
  color: var(--text);
  padding: 7px;
  border-radius: 8px;
}

button:hover, select:hover {
  border-color: var(--accent);
}

#url {
  flex: 1;
}

/* DESKTOP */
#desktop {
  position: relative;
  width: 100vw;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* WINDOW */
.window {
  position: absolute;
  width: 70vw;
  height: 70vh;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,.6);
}

.titlebar {
  background: #020617;
  color: var(--text);
  padding: 8px;
  cursor: move;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tabs {
  display: flex;
  gap: 6px;
  padding: 6px;
  background: #020617;
}

.tab {
  padding: 4px 8px;
  border-radius: 6px;
  background: #020617;
  border: 1px solid #334155;
  cursor: pointer;
}

.tab.active {
  border-color: var(--accent);
}

iframe {
  width: 100%;
  height: calc(100% - 86px);
  border: none;
}

/* AI STATUS */
#aiStatus {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background: #020617;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 10px;
  font-size: 12px;
  max-width: 260px;
  display: none;
}
</style>
</head>

<body>

<div id="top">
  <select onchange="openApp(this.value)">
    <option value="">➕ Open App</option>
    <option value="proxy">🌐 Browser</option>
    <option value="snake">🐍 Snake</option>
    <option value="dino">🦖 Dino</option>
  </select>

  <input id="url" placeholder="Search or enter URL" />
  <button onclick="openProxy()">Open Tab</button>
  <button onclick="toggleAI()">🤖 AI Inspector</button>
</div>

<div id="desktop"></div>
<div id="aiStatus"></div>

<script>
const desktop = document.getElementById("desktop");
const input = document.getElementById("url");
const aiBox = document.getElementById("aiStatus");

let z = 10;

/* ---------- SMART INPUT ---------- */
function normalize(v) {
  v = v.trim();
  if (!v) return "";
  if (/^https?:\/\//i.test(v)) return v;
  if (v.startsWith("www.")) return "https://" + v;
  if (v.includes(".")) return "https://" + v;
  return "https://duckduckgo.com/?q=" + encodeURIComponent(v);
}

/* ---------- WINDOW ---------- */
function createWindow(title) {
  const w = document.createElement("div");
  w.className = "window";
  w.style.top = "60px";
  w.style.left = "60px";
  w.style.zIndex = ++z;

  w.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <button onclick="this.closest('.window').remove()">✖</button>
    </div>
    <div class="tabs"></div>
  `;

  drag(w);
  desktop.appendChild(w);
  return w;
}

/* ---------- TABS ---------- */
function addTab(win, label, src) {
  const tabs = win.querySelector(".tabs");
  const iframe = document.createElement("iframe");
  iframe.src = src;

  const tab = document.createElement("div");
  tab.className = "tab active";
  tab.textContent = label;

  [...tabs.children].forEach(t => t.classList.remove("active"));
  tabs.appendChild(tab);

  win.querySelectorAll("iframe").forEach(i => i.remove());
  win.appendChild(iframe);

  tab.onclick = () => {
    win.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    win.querySelectorAll("iframe").forEach(i => i.remove());
    win.appendChild(iframe);
  };

  monitorIframe(iframe);
}

/* ---------- APPS ---------- */
function openApp(app) {
  if (!app) return;
  const w = createWindow(app);
  if (app === "snake") addTab(w, "Snake", "/games/snake.html");
  if (app === "dino") addTab(w, "Dino", "/games/dino.html");
}

function openProxy() {
  const url = normalize(input.value);
  if (!url) return;
  const w = createWindow("Browser");
  addTab(w, "Tab 1", "/proxy/" + encodeURIComponent(url));
}

/* ---------- DRAG ---------- */
function drag(el) {
  const bar = el.querySelector(".titlebar");
  let x=0,y=0,dx=0,dy=0;

  bar.onmousedown = e => {
    el.style.zIndex = ++z;
    dx = e.clientX; dy = e.clientY;
    document.onmousemove = e => {
      x = dx - e.clientX;
      y = dy - e.clientY;
      dx = e.clientX; dy = e.clientY;
      el.style.top = (el.offsetTop - y) + "px";
      el.style.left = (el.offsetLeft - x) + "px";
    };
    document.onmouseup = () => document.onmousemove = null;
  };
}

/* ---------- AI INSPECTOR (SAFE) ---------- */
function monitorIframe(frame) {
  let retries = 0;

  const check = setInterval(() => {
    try {
      const doc = frame.contentDocument;
      if (!doc || doc.body.innerText.includes("Proxy error")) {
        retries++;
        aiLog("⚠️ Load issue detected. Retry " + retries);
        frame.src = frame.src;
      }
      if (retries >= 3) {
        aiLog("❌ Page failed after retries.");
        clearInterval(check);
      }
    } catch {}
  }, 3000);
}

function aiLog(msg) {
  aiBox.style.display = "block";
  aiBox.innerHTML = `<strong>AI Inspector</strong><br>${msg}`;
}

function toggleAI() {
  aiBox.style.display = aiBox.style.display === "none" ? "block" : "none";
}
</script>

</body>
</html>

showTarget('dino');
</script>

</body>
</html>
