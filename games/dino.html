<!DOCTYPE html>
<html>
<head>
<title>Dino (Offline)</title>
<style>
 body { margin:0; background:#eee; }
 canvas { display:block; margin:auto; }
</style>
</head>
<body>
<canvas id="c" width="500" height="200"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let dino=20,y=160,vy=0,obs=500;

document.onkeydown=()=>{ if(y>=160) vy=-12; };

setInterval(()=>{
 x.clearRect(0,0,500,200);
 vy+=0.6; y+=vy; if(y>160){y=160;vy=0;}
 obs-=5; if(obs<0) obs=500;
 if(obs<40&&y>140){ obs=500; }
 x.fillRect(20,y,20,20);
 x.fillRect(obs,170,20,30);
},30);
</script>
</body>
</html>
