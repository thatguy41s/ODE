<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ODE Hub 3.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #0b0f1a;
  --panel: #12182b;
  --accent: #6cf2c2;
  --text: #e8ecff;
  --muted: #8892c6;
  --danger: #ff6b6b;
}

* { box-sizing: border-box; font-family: system-ui, sans-serif; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* TOP BAR */
#topbar {
  height: 48px;
  display: flex;
  gap: 8px;
  padding: 8px;
  background: #0e1430;
  align-items: center;
}

#url {
  flex: 1;
  background: #0a1025;
  border: 1px solid #1c2550;
  color: var(--text);
  padding: 8px 10px;
  border-radius: 8px;
}

button {
  background: var(--panel);
  color: var(--text);
  border: 1px solid #1c2550;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }

/* DESKTOP */
#desktop {
  position: absolute;
  inset: 48px 0 0 0;
}

/* WINDOWS */
.window {
  position: absolute;
  width: 520px;
  height: 360px;
  background: var(--panel);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.titlebar {
  height: 36px;
  background: #0d1433;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  cursor: move;
}

.tabs {
  display: flex;
  background: #0a1025;
  overflow-x: auto;
}

.tab {
  padding: 6px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.tab.active {
  background: var(--panel);
  border-bottom: 2px solid var(--accent);
}

iframe {
  flex: 1;
  border: none;
  background: #000;
}

/* AI STATUS */
#aiStatus {
  position: fixed;
  bottom: 10px;
  right: 10px;
  width: 260px;
  background: #0d1433;
  border: 1px solid #1c2550;
  border-radius: 12px;
  padding: 10px;
  font-size: 12px;
  display: none;
}
</style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Search or enter URL (Ctrl+L)" />
  <button onclick="openProxy()">Open</button>
  <button onclick="openGame('snake')">Snake</button>
  <button onclick="openGame('dino')">Dino</button>
  <button onclick="toggleAI()">AI</button>
</div>

<div id="desktop"></div>
<div id="aiStatus"></div>

<script>
const desktop = document.getElementById("desktop");
const input = document.getElementById("url");
const ai = document.getElementById("aiStatus");
let z = 10;

/* UTIL */
function normalize(v) {
  v = v.trim();
  if (!v) return "";
  if (/^https?:\/\//i.test(v)) return v;
  if (v.startsWith("www.")) return "https://" + v;
  if (v.includes(".")) return "https://" + v;
  return "https://duckduckgo.com/?q=" + encodeURIComponent(v);
}

/* WINDOW SYSTEM */
function createWindow(title) {
  const w = document.createElement("div");
  w.className = "window";
  w.style.top = "80px";
  w.style.left = "80px";
  w.style.zIndex = ++z;

  w.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <button onclick="this.closest('.window').remove()">✕</button>
    </div>
    <div class="tabs"></div>
  `;
  drag(w);
  desktop.appendChild(w);
  return w;
}

function addTab(win, label, src) {
  const tabs = win.querySelector(".tabs");
  const iframe = document.createElement("iframe");
  iframe.src = src;

  const tab = document.createElement("div");
  tab.className = "tab active";
  tab.textContent = label;

  [...tabs.children].forEach(t => t.classList.remove("active"));
  tabs.appendChild(tab);

  win.querySelectorAll("iframe").forEach(i => i.remove());
  win.appendChild(iframe);

  tab.onclick = () => {
    win.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    win.querySelectorAll("iframe").forEach(i => i.remove());
    win.appendChild(iframe);
  };

  monitorIframe(iframe);
}

/* APPS */
function openProxy() {
  const url = normalize(input.value);
  if (!url) return;
  const w = createWindow("Browser");
  addTab(w, "Tab 1", url);
}

function openGame(game) {
  const w = createWindow(game.toUpperCase());
  addTab(w, game, `/games/${game}.html`);
}

/* DRAG */
function drag(el) {
  const bar = el.querySelector(".titlebar");
  let x=0,y=0,dx=0,dy=0;
  bar.onmousedown = e => {
    el.style.zIndex = ++z;
    dx = e.clientX; dy = e.clientY;
    document.onmousemove = e => {
      x = dx - e.clientX;
      y = dy - e.clientY;
      dx = e.clientX; dy = e.clientY;
      el.style.top = (el.offsetTop - y) + "px";
      el.style.left = (el.offsetLeft - x) + "px";
    };
    document.onmouseup = () => document.onmousemove = null;
  };
}

/* AI MONITOR (SAFE) */
function monitorIframe(frame) {
  let retries = 0;
  const timer = setInterval(() => {
    try {
      if (!frame.contentDocument) throw 1;
    } catch {
      retries++;
      aiLog("⚠️ Load issue detected. Retrying...");
      frame.src = frame.src;
      if (retries >= 3) {
        aiLog("❌ Page failed repeatedly.");
        clearInterval(timer);
      }
    }
  }, 4000);
}

function aiLog(msg) {
  ai.style.display = "block";
  ai.innerHTML = "<b>AI Inspector</b><br>" + msg;
}

function toggleAI() {
  ai.style.display = ai.style.display === "none" ? "block" : "none";
}

/* KEYBOARD SHORTCUTS */
document.addEventListener("keydown", e => {
  const win = document.querySelector(".window:last-child");

  if (e.ctrlKey && e.key === "l") {
    e.preventDefault();
    input.focus();
    input.select();
  }

  if (e.ctrlKey && e.key === "t") {
    e.preventDefault();
    openProxy();
  }

  if (e.ctrlKey && e.key === "w") {
    e.preventDefault();
    win?.remove();
  }

  if (e.ctrlKey && e.key === "r") {
    e.preventDefault();
    win?.querySelectorAll("iframe").forEach(f => f.src = f.src);
  }
});
</script>

</body>
</html>
